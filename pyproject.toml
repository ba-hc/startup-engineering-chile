[project]
name = "startup-engineering-chile"
version = "1.1.0"
description = "Scripts de la skill Startup Engineering Chile (solo biblioteca estándar)."
requires-python = ">=3.8"
dependencies = []

[tool.ruff]
line-length = 140
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E701/E702: los subparsers de argparse se escriben compactos a propósito.
# B007/B023/E741: patrones aceptables en scripts cortos. E501: hay regex y HTML largos.
ignore = ["E701", "E702", "B007", "B023", "E731", "E501", "E741"]
