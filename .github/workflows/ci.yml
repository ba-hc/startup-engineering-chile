name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Integridad del paquete (rutas, enlaces internos, UTF-8, versiones, tamaño de SKILL.md)
        run: python tools/check_refs.py
      - name: Datos contra sus esquemas (instrumentos, parámetros, umbrales)
        run: python tools/validar_datos.py
      - name: Pruebas de los scripts
        run: python -m unittest discover -s tests -v
      - name: Expediente de ejemplo válido y sin alertas
        run: |
          python skills/startup-engineering-chile/scripts/expediente.py validar --dir examples/expediente_demo
          python skills/startup-engineering-chile/scripts/auditar.py --dir examples/expediente_demo --estricto --hoy 2026-11-25
      - name: Modelo financiero sin fórmulas rotas
        run: |
          python skills/startup-engineering-chile/scripts/modelo_xlsx.py verificar skills/startup-engineering-chile/assets/modelo_financiero.xlsx
          python skills/startup-engineering-chile/scripts/modelo_xlsx.py verificar examples/expediente_demo/expediente/entregables/modelo_financiero.xlsx

  # Versión mínima soportada. Los runners actuales ya no traen Python 3.8,
  # así que se prueba dentro de la imagen oficial de Docker.
  python-minima:
    runs-on: ubuntu-latest
    container: python:3.8-slim
    steps:
      - uses: actions/checkout@v4
      - run: python tools/check_refs.py
      - run: python tools/validar_datos.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/startup-engineering-chile/scripts/expediente.py validar --dir examples/expediente_demo
      - run: python skills/startup-engineering-chile/scripts/auditar.py --dir examples/expediente_demo --estricto --hoy 2026-11-25

  estilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check skills/startup-engineering-chile/scripts tests tools
