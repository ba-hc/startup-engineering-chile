schema_version: "1.1"
name: derivacion-sercotec-tradicional
expected_outcome: |
  Con tacto y razones, explica que Semilla Inicia de CORFO no calza: evalúa innovación y potencial de escalamiento, y una empresa con 4 años de inicio de actividades y ventas queda fuera de las condiciones de referencia para personas jurídicas. No desanima el negocio: lo trata como un negocio tradicional viable que calza con otra línea. Deriva a Sercotec (la línea que corresponda a un negocio con inicio de actividades y ventas; Capital Abeja o Capital Semilla Emprende solo si califica según el llamado) u otros programas para negocios tradicionales, y pide verificar la convocatoria vigente (fechas, montos y requisitos). Responde breve, sin crear expediente ni empujar metodología de startups.
