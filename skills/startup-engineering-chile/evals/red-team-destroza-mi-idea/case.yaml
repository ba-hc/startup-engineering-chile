schema_version: "1.1"
name: red-team-destroza-mi-idea
expected_outcome: |
  Hace un red team estructurado: los supuestos más riesgosos (quién paga, confianza y seguridad, oferta de universitarios, retención, responsabilidad legal), cada uno con la prueba más barata para refutarlo. No se queda en críticas: termina con la hipótesis que decide si sigue y un experimento con criterio previo antes de renunciar.
