name: pilot-purgatory-b2b
expected_outcome: |
  No declara PMF ni escribe "PMF validado" en el pitch: cinco pilotos gratuitos sin orden de compra ni carta de intención con precio son evidencia débil (interés, no compra), y la startup está en G6 (piloto) camino a G7 (venta/adopción), no en G8. Propone convertir los pilotos en pagados o en una carta de intención con precio u orden de compra, con un criterio de conversión fijado antes (KPI, plazo, precio y quién firma), ofrece una redacción honesta para el pitch y responde en formato 1-3-1.
